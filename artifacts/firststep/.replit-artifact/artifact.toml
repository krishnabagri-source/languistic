kind = "web"
previewPath = "/"
title = "FirstStep"
description = "A calm, frontend-first communication assistant that helps people reflect on difficult messages and prepare a thoughtful response. Includes deterministic demo analysis, editable response suggestions, and no required backend or API keys."
version = "1.0.0"
id = "artifacts/firststep"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25520

[services.development]
run = "pnpm --filter @workspace/firststep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firststep", "run", "build" ]
serve = "static"
publicDir = "artifacts/firststep/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25520"
BASE_PATH = "/"
